<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Agent — New Analysis</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
<style>
  body { background: #f8f9fa; }
  .topbar { background: #212529; color: #fff; padding: 1rem 0; margin-bottom: 2rem; }
  .topbar a { color: #adb5bd; text-decoration: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="container d-flex align-items-center gap-3">
    <a href="/">← Dashboard</a>
    <h1 class="h4 mb-0 text-white">New Analysis</h1>
  </div>
</div>

<div class="container" style="max-width:640px">
  {% if error %}
  <div class="alert alert-danger"><pre style="margin:0;white-space:pre-wrap">{{ error }}</pre></div>
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body">
      <p class="text-muted small">
        This form runs <code>td-agent analyze</code> synchronously.
        Analysis can take several minutes depending on repo size and commit count.
      </p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Repository path (absolute)</label>
          <input type="text" name="repo_path" class="form-control font-monospace"
                 placeholder="/home/user/my-project" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Sampling mode</label>
          <select name="mode" class="form-select" id="modeSelect" onchange="toggleN()">
            <option value="sample_every">Every N commits</option>
            <option value="commits">Fixed number of commits</option>
            <option value="test">Test — latest commit only</option>
          </select>
        </div>
        <div class="mb-4" id="nField">
          <label class="form-label fw-semibold" id="nLabel">N (sample every N commits)</label>
          <input type="number" name="n_value" class="form-control" value="20" min="1">
        </div>
        <button type="submit" class="btn btn-danger w-100">Start Analysis</button>
      </form>
    </div>
  </div>
</div>

<script>
function toggleN() {
  const mode = document.getElementById('modeSelect').value;
  const field = document.getElementById('nField');
  const label = document.getElementById('nLabel');
  if (mode === 'test') { field.style.display = 'none'; return; }
  field.style.display = '';
  label.textContent = mode === 'commits' ? 'Number of commits to sample' : 'N (sample every N commits)';
}
</script>
</body>
</html>
